# SonarCloud project configuration.
#
# Read by the CI-based scanner in .github/workflows/sonarcloud.yaml. That workflow exists
# because SonarCloud's Automatic Analysis — the GitHub App mode this project used previously —
# cannot import coverage reports at all, so the "Coverage on New Code" quality gate condition
# evaluated to 0.0% on every pull request regardless of content: a passing-looking signal that
# measured nothing.
#
# The two modes are mutually exclusive. Automatic Analysis must stay DISABLED (SonarCloud →
# Administration → Analysis Method); re-enabling it both breaks the scanner ("You are running
# CI analysis while Automatic Analysis is enabled") and takes coverage back to 0.0%.
sonar.projectKey=ptarmiganlabs_butler-sos
sonar.organization=ptarmiganlabs

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/__tests__/**/*.js,**/*.test.js

# Generated by `npm test` (jest.config.mjs sets collectCoverage and the lcov reporter).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Excluded from analysis: generated output, vendored assets, and the coverage report itself.
sonar.exclusions=coverage/**,docs/**,node_modules/**,src/config/**
