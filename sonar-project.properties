# SonarCloud project configuration.
#
# Analysis itself runs as a GitHub App, not from a workflow, so this file exists mainly to
# tell Sonar where the coverage report is. Without sonar.javascript.lcov.reportPaths the
# "Coverage on New Code" quality gate condition evaluates to 0.0% on every pull request
# regardless of content, which is a passing-looking signal that measures nothing.
sonar.projectKey=ptarmiganlabs_butler-sos
sonar.organization=ptarmiganlabs

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/__tests__/**/*.js,**/*.test.js

# Generated by `npm test` (jest.config.mjs sets collectCoverage and the lcov reporter).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Excluded from analysis: generated output, vendored assets, and the coverage report itself.
sonar.exclusions=coverage/**,docs/**,node_modules/**,src/config/**
