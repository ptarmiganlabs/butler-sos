name: ci
on:
  workflow_dispatch:
    inputs:
      rehearse_signing:
        description: Build and sign the Windows binary from this commit, and release nothing
        type: boolean
        default: false
  push:
    branches:
      - master
permissions: {}
jobs:
  release-please:
    # A signing rehearsal must not cut a release on the way. Skipping release-please also skips
    # every job that waits for its releases_created output, so a rehearsal runs only the Windows
    # build and signing jobs, which say so explicitly.
    if: ${{ !inputs.rehearse_signing }}
    permissions: {}
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      release_tag_name: ${{ steps.release.outputs['tag_name'] }}
      release_version: ${{ steps.release.outputs['version'] }}
      release_upload_url: ${{ steps.release.outputs['upload_url'] }}
      # The commit release-please released. Not necessarily the commit that started this run:
      # release-please releases master's HEAD, a different commit whenever another push started it.
      release_sha: ${{ steps.release.outputs['sha'] }}
    env:
      GITHUB_REF: ${{ github.ref }}
      GITHUB_TOKEN: ${{ secrets.PAT }}
      DIST_FILE_NAME: butler-sos
    steps:
      - name: Show github.ref
        run: echo "$GITHUB_REF"

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: github.repository_owner == 'ptarmiganlabs'
        with:
          token: ${{ secrets.RELEASE_PLEASE_PAT }}
          # optional. customize path to release-please-config.json
          config-file: release-please-config.json
          # optional. customize path to .release-please-manifest.json
          manifest-file: .release-please-manifest.json
          target-branch: master

      - name: Show output from Release-Please
        if: false
        env:
          RELEASE_PLEASE_OUTPUT: ${{ toJSON(steps.release.outputs) }}
        run: echo "$RELEASE_PLEASE_OUTPUT"

      # Keep for reference - example of how to show individual outputs
      # - name: Show output from Release-Please (debug)
      #   if: false
      #   run: |
      #     echo "releases_created: ${{ steps.release.outputs.releases_created }}"
      #     echo "release_created : ${{ steps.release.outputs.release_created }}"
      #     echo "draft           : ${{ steps.release.outputs['draft'] }}"
      #     echo "path            : ${{ steps.release.outputs['path'] }}"
      #     echo "upload_url      : ${{ steps.release.outputs['upload_url'] }}"
      #     echo "html_url        : ${{ steps.release.outputs['html_url'] }}"
      #     echo "tag_name        : ${{ steps.release.outputs['tag_name'] }}"
      #     echo "version         : ${{ steps.release.outputs['version'] }}"
      #     echo "major           : ${{ steps.release.outputs['major'] }}"
      #     echo "minor           : ${{ steps.release.outputs['minor'] }}"
      #     echo "patch           : ${{ steps.release.outputs['patch'] }}"
      #     echo "sha             : ${{ steps.release.outputs['sha'] }}"

  sbom-build:
    permissions:
      contents: write
    needs: release-please
    runs-on: ubuntu-latest

    if: needs.release-please.outputs.releases_created == 'true'
    env:
      DIST_FILE_NAME: butler-sos

    steps:
      - name: Checkout the released commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The commit release-please released, not github.sha, so that every asset of a release
          # is built from the same commit as the Windows binary is.
          ref: ${{ needs.release-please.outputs.release_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --omit=dev --ignore-scripts

      - name: Generate SBOM
        run: |
          curl --proto-redir '=https' -fsSL -o "$RUNNER_TEMP/sbom-tool" https://github.com/microsoft/sbom-tool/releases/latest/download/sbom-tool-linux-x64
          chmod +x $RUNNER_TEMP/sbom-tool

          mkdir -p ./build

          $RUNNER_TEMP/sbom-tool generate -b ./build -bc . -pn ${DIST_FILE_NAME} -pv ${{ needs.release-please.outputs.release_version }} -ps "Ptarmigan Labs" -nsb https://sbom.ptarmiganlabs.com -V verbose

      - name: List generated SBOM files (debug)
        run: |
          echo "=== Build directory structure ==="
          find ./build -type f -name "*.json" -o -name "*.spdx*" | head -20
          echo "=== File sizes ==="
          find ./build -type f -name "*.json" -o -name "*.spdx*" -exec ls -la {} \;

      - name: Upload SBOM to Release
        uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b # v1.20.0
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          # artifactContentType: raw
          draft: true
          # Leaves the draft state alone on update, so a re-run after publishing keeps it published.
          omitDraftDuringUpdate: true
          artifacts: './build/**/*.spdx.json'
          token: ${{ github.token }}
          tag: ${{ needs.release-please.outputs.release_tag_name }}

      - name: Upload SBOM as Workflow Artifact (backup)
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sbom-${{ needs.release-please.outputs.release_version }}
          path: './build/'
          retention-days: 3

  # On a GitHub-hosted runner: butler-sos is public, so it costs nothing, and the self-hosted
  # runner groups do not admit public repositories (the 15.1.0 macOS build waited for mac-build2
  # until one was opened by hand). Each run gets a VM of its own, so the temporary keychain and
  # decoded certificate that scripts/release-macos.sh creates go with it, and the release and
  # insiders builds no longer need a shared concurrency group to keep them apart.
  release-macos-arm64:
    permissions:
      contents: write
    needs: release-please
    runs-on: macos-15
    # timeout-minutes: 15

    if: needs.release-please.outputs.releases_created == 'true'
    env:
      DIST_FILE_NAME: butler-sos
      GITHUB_TOKEN: ${{ secrets.PAT }}
      MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE_BASE64_CODESIGN }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_CODESIGN_PWD }}
      MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_CODESIGN_NAME }}
      MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
      PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
      PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
      PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
    steps:
      - name: Release tag and upload url from previous job (debug)
        if: false
        run: |
          echo "tag_name   : ${{ needs.release-please.outputs.release_tag_name }}"
          echo "version    : ${{ needs.release-please.outputs.release_version }}"
          echo "upload_url : ${{ needs.release-please.outputs.release_upload_url }}"

      - name: Checkout the released commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The commit release-please released, not github.sha, so that every asset of a release
          # is built from the same commit as the Windows binary is.
          ref: ${{ needs.release-please.outputs.release_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts

      - name: Build binaries
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.release_version }}
        run: bash ./scripts/release-macos.sh

      - name: Upload to existing release
        uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b # v1.20.0
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          artifactContentType: raw
          # artifactContentType: application/zip
          draft: true
          # Leaves the draft state alone on update, so a re-run after publishing keeps it published.
          omitDraftDuringUpdate: true
          tag: ${{ needs.release-please.outputs.release_tag_name }}
          artifacts: ./butler-sos-${{ needs.release-please.outputs.release_version }}-macos-arm64.zip
          token: ${{ github.token }}

      - name: Tidy up before existing
        run: |
          pwd
          ls -la 
          rm -f build.cjs certificate.p12
          rm -f "./${DIST_FILE_NAME}"
          rm -f "./${DIST_FILE_NAME}-${{ needs.release-please.outputs.release_version }}-macos-arm64.zip"

  # ------------------------------------------------------------------
  # Windows, in three jobs, so that no job both runs repository code and holds the signing
  # credential. persona and magpie-cli sign the same way:
  #
  #   build-win64    repository code and npm, no credential   -> unsigned butler-sos.exe
  #   sign-win64     the Azure credential, no repository code -> signed butler-sos.exe
  #   publish-win64  neither                                  -> zip attached to the release
  #
  # All three run on GitHub-hosted runners. butler-sos is public, so they cost nothing, and the
  # self-hosted runner groups do not admit public repositories.
  #
  # Rehearsable, which is the only way to prove the signing credential before a release depends
  # on it:
  #
  #   gh workflow run ci.yaml --ref master -f rehearse_signing=true
  #
  # builds master's HEAD, signs it, verifies the signature and stops. Nothing is released; the
  # signed binary is kept as a workflow artifact for three days. It has to be master: sign-win64
  # runs in the release-signing environment, which admits no other branch.
  # ------------------------------------------------------------------
  build-win64:
    needs: release-please
    # !cancelled() in place of the implicit success(): a rehearsal skips release-please, and a
    # skipped dependency would otherwise skip this job too. A release still needs
    # releases_created, which a failed or skipped release-please never sets.
    if: >-
      !cancelled()
      && (needs.release-please.outputs.releases_created == 'true'
          || (github.event_name == 'workflow_dispatch' && inputs.rehearse_signing))
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout only
    steps:
      # A release builds the released commit, never github.sha. A rehearsal has no release, so it
      # builds the commit it was started on.
      - name: Checkout the commit being built
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-please.outputs.releases_created == 'true' && needs.release-please.outputs.release_sha || github.sha }}
          persist-credentials: false

      # No npm cache: what this job builds gets signed, so it starts from nothing an earlier run
      # left behind.
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Verify the checkout is the version being released
        if: needs.release-please.outputs.releases_created == 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.release_version }}
        run: |
          $actual = node -p "require('./package.json').version"
          Write-Host "release-please : $env:RELEASE_VERSION"
          Write-Host "package.json   : $actual"
          if ($actual -ne $env:RELEASE_VERSION) {
            throw "Refusing to build: package.json says $actual, but the release is $env:RELEASE_VERSION."
          }

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # scripts/release-win.ps1 builds, smoke-tests and checks the binary carries no signature,
      # records the digest sign-win64 checks against, and stages what ships beside the binary in
      # win64-extras/. The script, not this file, defines the zip's layout.
      - name: Build the unsigned binary
        shell: pwsh
        run: |
          ./scripts/release-win.ps1
          $hash = Get-Content -LiteralPath ./butler-sos.exe.sha256
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Unsigned Windows binary SHA256: ``$hash``"

      # Kept 30 days for a release, which is as long as GitHub lets a job be re-run. A failed
      # sign-win64 or publish-win64 can only be recovered with "Re-run failed jobs", and that needs
      # these artifacts still to exist: "Re-run all jobs" builds nothing, because release-please
      # then finds the release already made and reports no new one. A rehearsal needs three days.
      - name: Upload the unsigned binary
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: win64-unsigned
          path: |
            butler-sos.exe
            butler-sos.exe.sha256
          retention-days: ${{ inputs.rehearse_signing && 3 || 30 }}
          if-no-files-found: error

      # Straight to publish-win64, never through sign-win64, which handles one file and nothing else.
      - name: Upload the files that ship beside it
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: win64-extras
          path: win64-extras/
          retention-days: ${{ inputs.rehearse_signing && 3 || 30 }}
          if-no-files-found: error

  sign-win64:
    needs: build-win64
    # Explicit, because the implicit success() fails when anything further up the chain was
    # skipped. A rehearsal skips release-please on purpose, so without this, signing would be
    # skipped two jobs down while the run still went green.
    if: ${{ !cancelled() && needs.build-win64.result == 'success' }}
    # INVARIANT: no actions/checkout, no npm and no ./scripts in this job. A compromised dependency
    # must not be able to reach the Azure OIDC token. A step that needs repository content belongs
    # in build-win64 or publish-win64.
    runs-on: windows-latest
    timeout-minutes: 15
    # This is what binds the OIDC token's subject. butler-sos uses GitHub's immutable subject, and
    # the signing app's federated credential in Entra (butler-sos-release-signing-immutable) must
    # match it exactly:
    #
    #   repo:ptarmiganlabs@6304190/butler-sos@86291664:environment:release-signing
    #
    # Renaming this environment or the repository, or transferring the repository, breaks signing
    # with AADSTS700213, "no matching federated identity record found". Regenerate the prefix rather
    # than retyping it, then append ":environment:release-signing":
    #
    #   gh api repos/ptarmiganlabs/butler-sos/actions/oidc/customization/sub --jq .sub_claim_prefix
    environment: release-signing
    permissions:
      id-token: write # the OIDC token azure/login exchanges for the signing credential
      contents: read # nothing is checked out; downloading this run's artifact needs no more
    steps:
      - name: Download the unsigned binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: win64-unsigned
          path: to-sign

      # GitHub already protects artifacts, so this cannot currently fail. It states what the job
      # assumes, and would catch a later change that rebuilds or re-uploads between build and sign.
      - name: Verify the artifact is what build-win64 produced
        shell: pwsh
        run: |
          $expected = (Get-Content to-sign/butler-sos.exe.sha256 -Raw).Trim()
          $actual = (Get-FileHash to-sign/butler-sos.exe -Algorithm SHA256).Hash
          Write-Host "built  : $expected"
          Write-Host "to sign: $actual"
          if ($actual -ne $expected) {
            throw "Refusing to sign: the artifact does not match the digest build-win64 recorded."
          }
          Remove-Item to-sign/butler-sos.exe.sha256

      - name: Azure login via OIDC
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign with Azure Artifact Signing
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.SIGNING_CERT_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\to-sign
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # A hard failure, deliberately: if signing fails, the release fails, rather than quietly
      # shipping something unsigned. Two readings of the same signature (signtool's chain and
      # timestamp check, and the one Windows itself makes), plus a check that the signer is
      # Ptarmigan Labs AB, so that a misconfigured certificate profile cannot sign as anyone else.
      - name: Verify the signature
        shell: pwsh
        run: |
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
                Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $st) { throw "signtool.exe not found on this runner." }
          & $st.FullName verify /pa /v to-sign\butler-sos.exe
          if ($LASTEXITCODE -ne 0) { throw "Signature verification failed." }
          $sig = Get-AuthenticodeSignature -LiteralPath to-sign\butler-sos.exe
          if ($sig.Status -ne 'Valid') { throw "Windows reads the signature as $($sig.Status): $($sig.StatusMessage)" }
          # The certificate's own parsed common name, compared exactly and case-sensitively. Not a
          # pattern over the subject string, which "Ptarmigan Labs ABC", "Ptarmigan Labs AB
          # Holding" or quoting in the distinguished name could get past.
          $signer = $sig.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          if ($signer -cne 'Ptarmigan Labs AB') {
            throw "Signed by an unexpected certificate: '$signer' ($($sig.SignerCertificate.Subject))"
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @(
            "Signed by: ``$($sig.SignerCertificate.Subject)``",
            "Timestamped by: ``$($sig.TimeStamperCertificate.Subject)``"
          )

      - name: Upload the signed binary
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: win64-signed
          path: to-sign/butler-sos.exe
          # 30 days for a release, so that a failed publish-win64 can still be re-run on its own;
          # see the uploads in build-win64. A rehearsal's binary stays three days, for anyone who
          # wants to try it on a real machine.
          retention-days: ${{ inputs.rehearse_signing && 3 || 30 }}
          if-no-files-found: error

  publish-win64:
    needs: [release-please, build-win64, sign-win64]
    # Never on a rehearsal, which has no release to attach to.
    if: >-
      !cancelled()
      && needs.release-please.outputs.releases_created == 'true'
      && needs.sign-win64.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # attaches the zip to the release
      id-token: write # for the provenance attestation only
      attestations: write # stores the provenance attestation
    steps:
      - name: Download the signed binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: win64-signed
          path: package

      - name: Download the files that ship beside it
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: win64-extras
          path: package

      # Lets anyone check, with `gh attestation verify`, that a given copy of the signed binary came
      # out of this workflow at this commit. Available because the repository is public.
      #
      # Only when this run's commit is the released commit. The attestation takes its source commit
      # from the run's OIDC token, which is github.sha, while build-win64 built release_sha. The two
      # differ when a later push's run is the one that creates the release, and an attestation that
      # names the wrong source commit is worse than none.
      - name: Generate build provenance
        if: needs.release-please.outputs.release_sha == github.sha
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: package/butler-sos.exe

      - name: Say why there is no build provenance
        if: needs.release-please.outputs.release_sha != github.sha
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.release_sha }}
          RUN_SHA: ${{ github.sha }}
        run: |
          echo "::warning::No build provenance attestation for the Windows binary: this run started at $RUN_SHA, but the release and its binary are from $RELEASE_SHA, and the attestation would name the wrong commit."

      # The signed executable at the top, and everything scripts/release-win.ps1 staged beside
      # it, as it staged it. The layout is the script's to define, not this step's.
      - name: Zip it
        env:
          ZIP_NAME: butler-sos-${{ needs.release-please.outputs.release_version }}-win.zip
        run: |
          set -euo pipefail
          cd package
          test -f butler-sos.exe || { echo "::error::butler-sos.exe is missing from what sign-win64 produced"; exit 1; }
          zip -r -9 "../$ZIP_NAME" .
          cd ..
          unzip -l "$ZIP_NAME"

      - name: Attach to the release
        uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b # v1.20.0
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          # The release exists already, as a draft, so this is an update and its draft state is
          # left alone: a re-run after the release is published cannot turn it back into a draft.
          # draft: true still applies should the release somehow not exist.
          draft: true
          omitDraftDuringUpdate: true
          artifactContentType: raw
          tag: ${{ needs.release-please.outputs.release_tag_name }}
          artifacts: ./butler-sos-${{ needs.release-please.outputs.release_version }}-win.zip
          token: ${{ github.token }}

  release-linux:
    permissions:
      contents: write
    needs: release-please
    runs-on: ubuntu-latest
    # timeout-minutes: 15

    if: needs.release-please.outputs.releases_created == 'true'
    env:
      DIST_FILE_NAME: butler-sos
      GITHUB_TOKEN: ${{ secrets.PAT }}
    steps:
      # Keep for reference - example of how to show individual outputs
      # - name: Release tag and upload url from previous job (debug)
      #   if: false
      #   run: |
      #     echo "tag_name   : ${{ needs.release-please.outputs.release_tag_name }}"
      #     echo "version    : ${{ needs.release-please.outputs.release_version }}"
      #     echo "upload_url : ${{ needs.release-please.outputs.release_upload_url }}"

      - name: Checkout the released commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The commit release-please released, not github.sha, so that every asset of a release
          # is built from the same commit as the Windows binary is.
          ref: ${{ needs.release-please.outputs.release_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts

      - name: Build binaries
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.release_version }}
        run: bash ./scripts/release-linux.sh

      - name: Upload to existing release
        uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b # v1.20.0
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          artifactContentType: raw
          # artifactContentType: application/zip
          draft: true
          # Leaves the draft state alone on update, so a re-run after publishing keeps it published.
          omitDraftDuringUpdate: true
          tag: ${{ needs.release-please.outputs.release_tag_name }}
          artifacts: ./butler-sos-${{ needs.release-please.outputs.release_version }}-linux-x64.zip
          token: ${{ github.token }}

      - name: Tidy up before existing
        run: |
          pwd
          ls -la
          rm build.cjs
          rm "./${DIST_FILE_NAME}"
          rm "./${DIST_FILE_NAME}-${{ needs.release-please.outputs.release_version }}-linux-x64.zip"
