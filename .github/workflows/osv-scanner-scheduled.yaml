name: OSV-Scanner Scheduled Scan

on:
    workflow_dispatch:
    schedule:
        # Run daily at 02:00 UTC (03:00 CET)
        - cron: '0 2 * * *'
    # Also run on push to master branch
    push:
        branches: [master]

permissions:
    # Required to upload SARIF file to CodeQL. See: https://github.com/github/codeql-action/issues/2117
    actions: read
    # Require writing security events to upload SARIF file to security tab
    security-events: write
    # Only need to read contents
    contents: read

jobs:
    scan-scheduled:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  # Nothing here pushes, so the checkout token should not be left behind in
                  # .git/config where later steps (or an artifact upload) could pick it up.
                  persist-credentials: false

            - name: Run scanner
              uses: google/osv-scanner-action/osv-scanner-action@c5996e0193a3df57d695c1b8a1dec2a4c62e8730 # v2.3.3
              with:
                  scan-args: |-
                      --output=results.json
                      --format=json
                      -r
                      ./
              continue-on-error: true

            - name: Run osv-scanner-reporter
              uses: google/osv-scanner-action/osv-reporter-action@c5996e0193a3df57d695c1b8a1dec2a4c62e8730 # v2.3.3
              with:
                  scan-args: |-
                      --output=results.sarif
                      --new=results.json
                      --gh-annotations=false
                      --fail-on-vuln=true

            - name: Upload artifact
              id: upload_artifact
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              with:
                  name: SARIF file
                  path: results.sarif
                  retention-days: 5

            - name: Upload to code-scanning
              if: ${{ !cancelled() }}
              uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98 # v4.32.6
              with:
                  sarif_file: results.sarif

            - name: Print Code Scanning URL
              if: ${{ !cancelled() }}
              # Context values are passed through the environment rather than expanded into the
              # script. A branch name is attacker-controllable, and direct `${{ }}` expansion
              # inside `run:` splices it into the shell before the shell ever sees it.
              env:
                  SERVER_URL: ${{ github.server_url }}
                  REPOSITORY: ${{ github.repository }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  echo "View the OSV-Scanner results in the 'Security' tab, using the following link:"
                  echo "${SERVER_URL}/${REPOSITORY}/security/code-scanning?query=is%3Aopen+branch%3A${REF_NAME}+tool%3Aosv-scanner"

            - name: Error troubleshooter
              if: ${{ always() && steps.upload_artifact.outcome == 'failure' }}
              run: |
                  echo "::error::Artifact upload failed. This is most likely caused by a error during scanning earlier in the workflow."
                  exit 1
