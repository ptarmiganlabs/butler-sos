name: insiders-build
on:
    workflow_dispatch:
    push:
        branches:
            - master
permissions: {}
jobs:
    insiders-build:
        if: |
            github.event_name == 'workflow_dispatch' ||
            !(
                github.event_name == 'push' &&
                (
                    contains(github.event.head_commit.message, 'chore: release') ||
                    contains(github.event.head_commit.message, 'chore(master): release') ||
                    contains(github.event.head_commit.message, 'release-please--branches--master')
                )
            )
        permissions:
            security-events: write
        concurrency:
            group: ${{ format('butler-sos-insiders-build-{0}-{1}', github.ref, matrix.os) }}
            cancel-in-progress: false
        strategy:
            matrix:
                # GitHub-hosted runners. The insiders Windows binary is not code-signed, so it needs
                # no runner that holds a signing certificate; release builds are signed in ci.yaml.
                os: [windows-latest, ubuntu-latest]
                include:
                    - os: windows-latest
                      # artifact_release_name: release-binaries-win
                      # artifact_release_path: release-binaries-win/*
                      artifact_insider: butler-sos--win-x64--${{ github.sha }}.zip
                    
                    - os: ubuntu-latest
                      artifact_insider: butler-sos--linux-x64--${{ github.sha }}.zip
                    
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: |
                  npm ci --ignore-scripts

            - name: Run Snyk to check for vulnerabilities
              # Snyk can be used to break the build when it detects security issues.
              # In this case we want to upload the SAST issues to GitHub Code Scanning
              #uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb
              if: |
                  github.repository_owner == 'ptarmiganlabs' &&
                  matrix.os == 'ubuntu-latest'
              continue-on-error: true # To make sure that SARIF upload gets called
              uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # master
              env:
                  # This is where you will need to introduce the Snyk API token created with your Snyk account
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
              with:
                  args: --file=./package.json --sarif-file-output=snyk.sarif
                  # command: test

            - name: Upload Snyk result to GitHub Code Scanning
              if: |
                  github.repository_owner == 'ptarmiganlabs' &&
                  matrix.os == 'ubuntu-latest'
              continue-on-error: true
              uses: github/codeql-action/upload-sarif@0d579ffd059c29b07949a3cce3983f0780820c98 # v4.32.6
              with:
                  sarif_file: snyk.sarif

            - name: Create binaries (Windows)
              if: matrix.os == 'windows-latest'
              env:
                  DIST_FILE_NAME: butler-sos
                  GITHUB_TOKEN: ${{ secrets.PAT }}
              run: ./scripts/insider-build-win.ps1

            - name: Create binaries (Linux)
              if: matrix.os == 'ubuntu-latest'
              env:
                  DIST_FILE_NAME: butler-sos
                  GITHUB_TOKEN: ${{ secrets.PAT }}
              run: bash ./scripts/insider-build-linux.sh

            - name: Upload insider build artifacts to GitHub
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              with:
                  name: ${{ matrix.artifact_insider }}
                  path: ${{ matrix.artifact_insider }}
                  retention-days: 7

    # macOS is a job of its own so that it alone runs in the release-signing environment, which
    # admits master alone. It is the only insiders build that uses the Apple signing secrets; the
    # Windows and Linux legs have no reason to be in the environment. Why the environment matters,
    # and why a GitHub-hosted runner: see release-macos-arm64 in ci.yaml.
    insiders-build-macos:
        # The same condition as insiders-build: no insiders build for a release commit.
        if: |
            github.event_name == 'workflow_dispatch' ||
            !(
                github.event_name == 'push' &&
                (
                    contains(github.event.head_commit.message, 'chore: release') ||
                    contains(github.event.head_commit.message, 'chore(master): release') ||
                    contains(github.event.head_commit.message, 'release-please--branches--master')
                )
            )
        permissions: {}
        concurrency:
            group: ${{ format('butler-sos-insiders-build-{0}-macos-15', github.ref) }}
            cancel-in-progress: false
        runs-on: macos-15
        timeout-minutes: 30
        environment: release-signing
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: |
                  npm ci --ignore-scripts

            - name: Create binaries (macOS)
              env:
                  DIST_FILE_NAME: butler-sos
                  GITHUB_TOKEN: ${{ secrets.PAT }}
                  MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE_BASE64_CODESIGN }}
                  MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_CODESIGN_PWD }}
                  MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_CODESIGN_NAME }}
                  MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
                  PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
                  PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
                  PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
              run: bash ./scripts/insider-build-mac.sh

            - name: Upload insider build artifacts to GitHub
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              with:
                  name: butler-sos--macos-arm64--${{ github.sha }}.zip
                  path: butler-sos--macos-arm64--${{ github.sha }}.zip
                  retention-days: 7
