# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # The Dockerfile pins its two base images by tag and digest, which is only safe if something
  # keeps them current — otherwise the published image silently stops receiving base-OS security
  # updates. This is that something. Both tags are exact (node:24.22.1-bookworm-slim,
  # debian:bookworm-20261005-slim), so every update arrives as a change of tag: a new Node.js
  # release, or a new dated Debian build that keeps the bookworm- prefix.
  #
  # Node majors are ignored. Offered one, Dependabot proposes only that (node 25 in #1482,
  # node 26 in #1490), and both sat unmerged while the base image went from 2026-08-06 to 15.1.0
  # without a single Debian security update. Moving to a new Node major is a decision of its own,
  # made in the Dockerfile, package.json `engines` and the SEA builds together. Debian needs no
  # such rule: its dated tags are not semantic versions, and every new date would count as a
  # major update.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Workflows pin every action to a commit SHA, which had the same staleness problem: nothing
  # was updating them.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

